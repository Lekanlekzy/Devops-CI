name: Setup npm/yarn/pnpm environment
description: >
  Checks out the repository, enables Corepack, installs Node.js with
  dependency caching, and installs dependencies with the detected package
  manager (npm, yarn, or pnpm).

inputs:
  node-version:
    description: Node.js version to install
    required: true
  package-manager:
    description: One of npm, yarn, pnpm
    required: true
  working-directory:
    description: Directory containing package.json
    required: false
    default: "."
  fetch-depth:
    description: git fetch-depth passed to actions/checkout
    required: false
    default: "1"

outputs:
  lockfile:
    description: Name of the lockfile used for cache keying
    value: ${{ steps.env.outputs.lockfile }}

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Enable Corepack and resolve lockfile
      id: env
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        corepack enable

        case "${{ inputs.package-manager }}" in
          pnpm) lockfile="pnpm-lock.yaml" ;;
          yarn) lockfile="yarn.lock" ;;
          *) lockfile="package-lock.json" ;;
        esac
        echo "lockfile=$lockfile" >> "$GITHUB_OUTPUT"

        if [ "${{ inputs.package-manager }}" != "npm" ] && ! grep -q '"packageManager"' package.json; then
          echo "No packageManager field found; activating latest ${{ inputs.package-manager }} via Corepack"
          corepack prepare "${{ inputs.package-manager }}@latest" --activate
        fi

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.package-manager }}
        cache-dependency-path: ${{ inputs.working-directory }}/${{ steps.env.outputs.lockfile }}

    - name: Install dependencies (npm)
      if: inputs.package-manager == 'npm'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci

    - name: Install dependencies (yarn)
      if: inputs.package-manager == 'yarn'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: yarn install --immutable

    - name: Install dependencies (pnpm)
      if: inputs.package-manager == 'pnpm'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
